<!doctype html>
<html lang="pl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eksport danych Koale</title>
<body style="font:16px system-ui;max-width:720px;margin:40px auto;padding:0 16px;background:#f4f8f2;color:#20352b">
<h1>Eksport danych Koale</h1>
<p>To narzędzie pobiera dane ze starej bazy do pliku na tym komputerze. Plik zawiera hasła użytkowników. Nie wysyłaj go nikomu i nie wrzucaj do GitHuba ani Netlify.</p>
<label>Adres starego Apps Script<br><input id="endpoint" style="width:100%;padding:10px" value="https://script.google.com/macros/s/AKfycbzDcUrRptgsCjE__4vaiY51H52XQe6WBtZoaxWJPC9Cl7hFB36JWTmDmszDCeiRP8hgrg/exec"></label><br><br>
<label>Nazwa administratora<br><input id="name" autocomplete="username" style="padding:10px"></label><br><br>
<label>Hasło administratora<br><input id="password" type="password" autocomplete="current-password" style="padding:10px"></label><br><br>
<label>Klasa<br><input id="class" value="6" style="padding:10px;width:80px"></label><br><br>
<button id="go" style="padding:12px 18px">Zaloguj i pobierz eksport</button><p id="status" role="status"></p>
<script>
const $=id=>document.getElementById(id);function jsonp(params){return new Promise((resolve,reject)=>{const cb="export_"+Date.now()+"_"+Math.random().toString(36).slice(2);const script=document.createElement("script");const timer=setTimeout(()=>done(new Error("Przekroczono czas odpowiedzi.")),20000);function done(error,value){clearTimeout(timer);delete window[cb];script.remove();error?reject(error):resolve(value)}window[cb]=value=>done(null,value);const url=new URL($("endpoint").value);Object.entries({...params,callback:cb}).forEach(([k,v])=>url.searchParams.set(k,v));script.onerror=()=>done(new Error("Nie udało się połączyć ze starym arkuszem."));script.src=url.toString();document.head.append(script)})}
$("go").onclick=async()=>{const button=$("go");button.disabled=true;$("status").textContent="Logowanie…";try{const login=await jsonp({action:"login",name:$ ("name").value,password:$ ("password").value,class:$ ("class").value});if(!login||login.success===false||!login.token)throw new Error(login?.error||"Logowanie nie powiodło się.");$("status").textContent="Pobieranie kont, zadań, czatu i pozostałych danych…";const data=await jsonp({action:"bootstrap",token:login.token});if(!data||data.success===false)throw new Error(data?.error||"Nie udało się pobrać danych.");const leaderboards={};for(const game of ["hop","eucalyptus"]){try{const board=await jsonp({action:"gameLeaderboard",game,token:login.token});leaderboards[game]=board.top10||[]}catch{leaderboards[game]=[]}}const payload={exportedAt:new Date().toISOString(),users:data.users||[],data:data.data||[],leaderboards};const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="migration-data.json";a.click();URL.revokeObjectURL(a.href);$("status").textContent=`Pobrano eksport. Konta: ${payload.users.length}, rekordy: ${payload.data.length}. Plik zawiera hasła — przechowuj go bezpiecznie.`}catch(error){$("status").textContent=error.message||"Wystąpił błąd."}finally{button.disabled=false}};
</script></body></html>
